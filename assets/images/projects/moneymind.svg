<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Cover graphic for MoneyMind. Replace with a real app screenshot when available. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="260" cy="180" r="420" fill="url(#glowGreen)"/>
  <circle cx="1340" cy="820" r="460" fill="url(#glowViolet)"/>

  <!-- App icon: wallet -->
  <g transform="translate(150 230)">
    <rect width="200" height="200" rx="48" fill="url(#tile)"/>
    <rect x="42" y="62" width="116" height="84" rx="16" fill="none" stroke="#ffffff" stroke-width="12"/>
    <path d="M58 62 L120 40 Q132 36 136 48 L140 62" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
    <rect x="112" y="90" width="46" height="28" rx="10" fill="#ffffff"/>
    <circle cx="128" cy="104" r="6" fill="#0d9488"/>
  </g>

  <!-- Title -->
  <text x="150" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="112" font-weight="800" fill="#ffffff" letter-spacing="-3">MoneyMind</text>
  <text x="154" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="500" fill="#a7f3d0">Journal &amp; Financial Goal Tracker</text>

  <!-- Feature pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#e5e7eb">
    <rect x="150" y="700" width="220" height="64" rx="32" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="186" cy="732" r="8" fill="#34d399"/>
    <text x="206" y="742">Expenses</text>

    <rect x="390" y="700" width="268" height="64" rx="32" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="426" cy="732" r="8" fill="#5eead4"/>
    <text x="446" y="742">Savings Goals</text>

    <rect x="678" y="700" width="262" height="64" rx="32" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="714" cy="732" r="8" fill="#a78bfa"/>
    <text x="734" y="742">Mood Journal</text>
  </g>

  <!-- Goal ring with trend line (decorative) -->
  <g transform="translate(1210 470)">
    <circle r="210" fill="#ffffff" fill-opacity="0.03"/>
    <circle r="170" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="34"/>
    <circle r="170" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"
            stroke-dasharray="768 1068" transform="rotate(-90)"/>
    <polyline points="-78,40 -32,4 6,24 74,-46" fill="none" stroke="#34d399" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="40,-48 76,-48 76,-12" fill="none" stroke="#34d399" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
